[package]
name = "particle-life-hyperdimensional"
version = "0.3.0"
edition = "2021"
description = "GPU-accelerated particle-life simulation with runtime 3D-8D physics"
license = "MIT"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
cpal = "0.15"
dirs = "5"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
env_logger = "0.11"
glam = "0.27"
log = "0.4"
pollster = "0.3"
rand = "0.8"
rfd = "0.14"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
wgpu = "0.19"
winit = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }
